<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm Your Appointment</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:var(--ink);color:var(--ivory);font-family:'Karla',sans-serif;font-weight:300;display:flex;padding:24px 16px;}
  .card{width:100%;max-width:440px;margin:auto;text-align:center}
  .brand{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ivory-dim);margin-bottom:10px}
  h1{font-family:var(--font-serif);font-weight:300;font-size:clamp(1.5rem,6vw,2rem);line-height:1.25}
  .sub{color:var(--ivory-dim);font-size:.95rem;line-height:1.6;margin-top:12px}
  .detail{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;text-align:left}
  .detail div{font-size:.9rem;color:var(--ivory-dim);margin-bottom:6px}
  .detail strong{color:var(--ivory);font-weight:500}
  .actions{margin-top:24px;display:flex;flex-direction:column;gap:10px}
  button,select,input{font-family:'Karla',sans-serif}
  .btn{padding:15px;background:var(--gold);color:var(--ink);border:none;border-radius:999px;font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn-ghost{padding:15px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:999px;font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  select{width:100%;padding:14px;background:var(--ink-soft);border:1px solid var(--line);color:var(--ivory);border-radius:8px;margin-top:10px}
  .msg{margin-top:16px;font-size:.88rem}
  .msg.error{color:var(--error)}
  .msg.ok{color:var(--ok)}
  .hidden{display:none}
  input[type=file]{width:100%;padding:10px 0;color:var(--ivory-dim);font-size:.85rem}
  label{display:block;text-align:left;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">Loading…</div>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const card = $("card");
const params = new URLSearchParams(location.search);
const token = params.get("token");
const REST_RPC = CONFIG.SUPABASE_URL + "/rest/v1/rpc/";
const HEADERS = { "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" };

async function rpc(fn, body) {
  const res = await fetch(REST_RPC + fn, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function fmt(iso) {
  const d = new Date(iso);
  const date = d.toLocaleDateString("en-US", { timeZone: "America/Port_of_Spain", weekday: "long", month: "long", day: "numeric" });
  const time = d.toLocaleTimeString("en-US", { timeZone: "America/Port_of_Spain", hour: "numeric", minute: "2-digit" });
  return date + " at " + time;
}

let booking = null;

async function load() {
  if (!token) {
    card.innerHTML = `<div class="brand">Eleganza · ENBfocus</div><h1>Missing link</h1><p class="sub">This confirmation link looks incomplete. Please use the link from your email or WhatsApp message.</p>`;
    return;
  }
  try {
    const rows = await rpc("get_booking_by_token", { p_token: token });
    booking = Array.isArray(rows) ? rows[0] : rows;
    if (!booking) throw new Error("not found");
    render();
  } catch (e) {
    card.innerHTML = `<div class="brand">Eleganza · ENBfocus</div><h1>Couldn't find that booking</h1><p class="sub">This link may have expired or already been used. Please reach out directly to sort out your appointment.</p>`;
  }
}

function render() {
  const brand = booking.business === "enbfocus" ? "ENBfocus" : "Eleganza";
  const statusLabel = { tentative: "Held — needs confirming", confirmed: "Confirmed", checked_in: "In the Chair", completed: "Completed", cancelled: "Cancelled" }[booking.status] || booking.status;
  const canAct = booking.status === "tentative" || booking.status === "confirmed";
  const showPayment = booking.business === "eleganza" && Number(booking.price) > 0 && booking.status !== "cancelled";
  card.innerHTML = `
    <div class="brand">${brand}</div>
    <h1>Hi ${esc(booking.client_name.split(" ")[0])}</h1>
    <p class="sub">Here's your appointment. Confirm it, or pick a new time if this no longer works.</p>
    <div class="detail">
      <div>Service <strong>${esc(booking.service_name)}</strong></div>
      ${booking.price ? `<div>Price <strong>${esc(booking.currency || "TTD")}$${Number(booking.price).toLocaleString()}</strong></div>` : ""}
      <div>When <strong>${fmt(booking.start_at)}</strong></div>
      <div>Status <strong>${esc(statusLabel)}</strong></div>
    </div>
    ${booking.business === "eleganza" ? `
    <div class="detail" style="border-color:var(--gold)">
      <div style="color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-bottom:8px">Before You Come In</div>
      <div>Please avoid, the day of your appointment: alcohol, caffeine, aspirin/blood thinners, working out, sun bathing, and facials or laser treatments.</div>
      <div style="margin-top:10px"><strong>In the 30 days before your appointment</strong> (for microblading/touch-up services), avoid: botox/fillers, chemical peels or fruit/milk acid treatments, laser treatments, and strong sun exposure or tanning.</div>
      <div style="margin-top:10px">15-minute grace period for confirmed appointments. After 15 min, a $200 late fee applies. After 30 min, you'll need to reschedule.</div>
      <div style="margin-top:10px"><strong>Studio location:</strong> 4 First Street East, deLa Marre Avenue, Trincity, Trinidad and Tobago — ground floor, inside A. Rauseo &amp; Associates office.</div>
      <div style="margin-top:10px"><a href="brow-education.html" style="color:var(--gold)">Want to read more first? Visit our Brow Education Library →</a></div>
    </div>
    ` : ""}
    ${canAct ? `
    <div class="actions">
      <button class="btn" id="btnConfirm">Confirm this time</button>
      <button class="btn-ghost" id="btnReschedule">Pick a different time</button>
      <button class="btn-ghost" id="btnCancel" style="color:var(--error);border-color:var(--error)">Cancel this appointment</button>
    </div>
    <div id="rescheduleBox" class="hidden">
      <input type="datetime-local" id="newTime" style="width:100%;padding:14px;background:var(--ink-soft);border:1px solid var(--line);color:var(--ivory);border-radius:8px;margin-top:14px" />
      <button class="btn" id="btnSubmitReschedule" style="width:100%;margin-top:10px">Save new time</button>
    </div>
    <div id="cancelBox" class="hidden">
      <textarea id="cancelReason" rows="3" placeholder="Let us know why (optional) — helps us serve you better" style="width:100%;padding:14px;background:var(--ink-soft);border:1px solid var(--line);color:var(--ivory);border-radius:8px;margin-top:14px;font-family:inherit;resize:vertical"></textarea>
      <button class="btn" id="btnSubmitCancel" style="width:100%;margin-top:10px;background:var(--error)">Confirm Cancellation</button>
    </div>
    ` : `<p class="msg ok" style="margin-top:20px">This appointment is ${esc(statusLabel).toLowerCase()} — no action needed.</p>`}
    ${showPayment ? (booking.payment_method ? `
    <div class="detail" style="border-color:var(--ok);text-align:center">
      <div style="color:var(--ok)">✓ Payment received — see you then!</div>
    </div>
    ` : `
    <div class="detail" id="paymentBox" style="border-color:var(--gold)">
      <div style="color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-bottom:8px">Settle Payment — Choose One</div>
      <div id="transferBox" class="hidden">
        <div class="detail" style="border-color:var(--line);margin-top:10px">
          <div>Bank <strong>${esc(CONFIG.BANK_NAME)}</strong></div>
          <div>Account Name <strong>${esc(CONFIG.BANK_ACCOUNT_NAME)}</strong></div>
          <div>Account # <strong>${esc(CONFIG.BANK_ACCOUNT_NUMBER)}</strong></div>
          <div>Account Type <strong>${esc(CONFIG.BANK_ACCOUNT_TYPE)}</strong></div>
        </div>
        <label for="proofFile">Upload a screenshot of the transfer</label>
        <input type="file" id="proofFile" accept="image/*" />
        <p class="msg error hidden" id="proofError"></p>
        <button class="btn" id="btnSubmitTransfer" style="width:100%;margin-top:10px">I've Sent It — Submit Proof</button>
      </div>
      <button class="btn-ghost" id="btnShowTransfer" style="width:100%">Pay by Bank Transfer</button>
      <p class="sub" style="margin:8px 0">— or —</p>
      <button class="btn-ghost" id="btnPayCash" style="width:100%">I'll Pay Cash at Check-In</button>
    </div>
    `) : ""}
    <div class="msg" id="msg"></div>
  `;
  if (canAct) {
    $("btnConfirm").onclick = onConfirm;
    $("btnReschedule").onclick = () => $("rescheduleBox").classList.remove("hidden");
    $("btnSubmitReschedule").onclick = onReschedule;
    $("btnCancel").onclick = () => $("cancelBox").classList.remove("hidden");
    $("btnSubmitCancel").onclick = onCancel;
  }
  if (showPayment && !booking.payment_method) {
    $("btnShowTransfer").onclick = () => {
      $("transferBox").classList.remove("hidden");
      $("btnShowTransfer").classList.add("hidden");
    };
    $("btnSubmitTransfer").onclick = onSubmitTransfer;
    $("btnPayCash").onclick = () => setPaymentMethod("cash_full", "Noted — please bring the full amount in cash to check-in.");
  }
}

function esc(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function onConfirm() {
  $("btnConfirm").disabled = true;
  $("btnConfirm").textContent = "Confirming…";
  try {
    await rpc("confirm_booking", { p_token: token });
    booking.status = "confirmed";
    render();
    $("msg").textContent = "Confirmed — see you then!";
    $("msg").className = "msg ok";
  } catch (e) {
    $("msg").textContent = "Something went wrong — please try again.";
    $("msg").className = "msg error";
    $("btnConfirm").disabled = false;
    $("btnConfirm").textContent = "Confirm this time";
  }
}

async function onReschedule() {
  const val = $("newTime").value;
  if (!val) return;
  const btn = $("btnSubmitReschedule");
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    const iso = new Date(val).toISOString();
    await rpc("reschedule_booking", { p_token: token, p_new_start_at: iso });
    const rows = await rpc("get_booking_by_token", { p_token: token });
    booking = Array.isArray(rows) ? rows[0] : rows;
    render();
    $("msg").textContent = "Rescheduled — see the new time above.";
    $("msg").className = "msg ok";
  } catch (e) {
    $("msg").textContent = "That time isn't available — please try another.";
    $("msg").className = "msg error";
    btn.disabled = false;
    btn.textContent = "Save new time";
  }
}

async function onCancel() {
  const reason = $("cancelReason").value.trim();
  const btn = $("btnSubmitCancel");
  btn.disabled = true;
  btn.textContent = "Cancelling…";
  try {
    await rpc("cancel_booking", { p_token: token, p_reason: reason || null });
    booking.status = "cancelled";
    render();
    $("msg").textContent = "Your appointment has been cancelled.";
    $("msg").className = "msg ok";
  } catch (e) {
    $("msg").textContent = "Something went wrong — please try again.";
    $("msg").className = "msg error";
    btn.disabled = false;
    btn.textContent = "Confirm Cancellation";
  }
}

async function uploadPaymentProof(file, bookingId) {
  const path = `${bookingId}/${Date.now()}-${file.name}`;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/payment-proofs/${path}`, {
    method: "POST",
    headers: { "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type": file.type || "application/octet-stream" },
    body: file
  });
  if (!res.ok) throw new Error(await res.text());
  return path;
}

async function setPaymentMethod(method, ackText) {
  try {
    await rpc("confirm_payment_intent", { p_token: token, p_method: method });
    booking.payment_method = method;
  } catch (e) {
    console.warn("confirm_payment_intent failed:", e);
  }
  fetch(`${CONFIG.SUPABASE_URL}/functions/v1/notify-payment`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify({ token, method })
  }).catch(e => console.warn("notify-payment failed:", e));
  render();
  $("msg").textContent = ackText;
  $("msg").className = "msg ok";
}

async function onSubmitTransfer() {
  const file = $("proofFile").files[0];
  $("proofError").classList.add("hidden");
  if (!file) {
    $("proofError").textContent = "Please choose a screenshot first.";
    $("proofError").classList.remove("hidden");
    return;
  }
  if (!file.type.startsWith("image/")) {
    $("proofError").textContent = "Please upload an image file.";
    $("proofError").classList.remove("hidden");
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    $("proofError").textContent = "That file's a bit large — please upload something under 8MB.";
    $("proofError").classList.remove("hidden");
    return;
  }
  const btn = $("btnSubmitTransfer");
  btn.disabled = true;
  btn.textContent = "Uploading…";
  try {
    const path = await uploadPaymentProof(file, booking.booking_id);
    await rpc("set_payment_proof", { p_token: token, p_path: path });
    await setPaymentMethod("bank_transfer", "Thanks — we'll verify your transfer and confirm you shortly.");
  } catch (e) {
    console.error(e);
    $("proofError").textContent = "Something went wrong uploading that — please try again.";
    $("proofError").classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = "I've Sent It — Submit Proof";
  }
}

load();
</script>
<script src="whatsapp-widget.js"></script>
</body>
</html>
