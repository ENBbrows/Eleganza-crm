<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You — Eleganza</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:var(--ink);color:var(--ivory);font-family:'Karla',sans-serif;font-weight:300;display:flex;padding:24px 16px;}
  .card{width:100%;max-width:440px;margin:auto;text-align:center}
  .brand{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ivory-dim);margin-bottom:10px}
  h1{font-family:var(--font-serif);font-weight:300;font-size:clamp(1.5rem,6vw,2rem);line-height:1.25}
  h1 em{font-style:italic;color:var(--gold)}
  .sub{color:var(--ivory-dim);font-size:.95rem;line-height:1.6;margin-top:12px}
  .detail{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;text-align:left}
  .detail div{font-size:.9rem;color:var(--ivory-dim);margin-bottom:6px}
  .detail strong{color:var(--ivory);font-weight:500}
  .k{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-bottom:8px;text-align:left}
  .btn{display:block;width:100%;margin-top:14px;padding:15px;background:var(--gold);color:var(--ink);border:none;border-radius:999px;font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none}
  .btn-ghost{display:block;width:100%;margin-top:10px;padding:15px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:999px;font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none}
  .review-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border:1px solid var(--gold);border-radius:999px;color:var(--ivory);text-decoration:none;font-size:.8rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;margin-top:10px}
  .review-btn:hover{background:rgba(168,83,47,.1)}
  .review-btn svg{flex:none}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">Loading…</div>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const card = $("card");
const params = new URLSearchParams(location.search);
const token = params.get("token");
const followupToken = params.get("followupToken");
const REST_RPC = CONFIG.SUPABASE_URL + "/rest/v1/rpc/";
const HEADERS = { "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" };

async function rpc(fn, body) {
  const res = await fetch(REST_RPC + fn, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function esc(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString("en-US", { timeZone: "America/Port_of_Spain", weekday: "long", month: "long", day: "numeric" });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  const date = fmtDate(iso);
  const time = d.toLocaleTimeString("en-US", { timeZone: "America/Port_of_Spain", hour: "numeric", minute: "2-digit" });
  return date + " at " + time;
}

async function load() {
  if (!token) {
    card.innerHTML = `<div class="brand">Eleganza</div><h1>Missing link</h1><p class="sub">This link looks incomplete. Please use the link Amii sent you.</p>`;
    return;
  }
  try {
    const rows = await rpc("get_receipt_by_token", { p_token: token });
    const receipt = Array.isArray(rows) ? rows[0] : rows;
    if (!receipt || receipt.business !== "eleganza") throw new Error("not found");

    let followupBooking = null;
    if (followupToken) {
      try {
        const fRows = await rpc("get_booking_by_token", { p_token: followupToken });
        followupBooking = Array.isArray(fRows) ? fRows[0] : fRows;
      } catch (e) {
        console.warn("followup lookup failed:", e);
      }
    }
    render(receipt, followupBooking);
  } catch (e) {
    card.innerHTML = `<div class="brand">Eleganza</div><h1>Couldn't find that receipt</h1><p class="sub">This link may have expired. Please reach out directly and we'll sort it out.</p>`;
  }
}

function render(receipt, followupBooking) {
  const first = (receipt.client_name || "beautiful").split(" ")[0];
  const aftercareParams = new URLSearchParams();
  if (receipt.client_name) aftercareParams.set("name", receipt.client_name);
  const aftercareHref = "aftercare.html" + (aftercareParams.toString() ? "?" + aftercareParams.toString() : "");

  let followupSection = "";
  if (receipt.category === "first_application") {
    followupSection = `
      <div class="detail" style="border-color:var(--gold)">
        <div class="k">Your Follow-Up</div>
        <div>Your ~5-week follow-up is a normal, expected part of the process — lock in a time whenever suits you.</div>
        <a class="btn" href="book-eleganza.html?category=touch_up&amp;suggestDays=35">Book Your Follow-Up</a>
      </div>`;
  } else if (receipt.category === "touch_up") {
    followupSection = followupBooking ? `
      <div class="detail" style="border-color:var(--gold)">
        <div class="k">Your Next Annual Touch-Up</div>
        <div>We've held <strong>${esc(fmtDateTime(followupBooking.start_at))}</strong> for your next Annual Touch-Up — just tap to confirm it.</div>
        <a class="btn" href="confirm.html?token=${esc(followupToken)}">Confirm My Annual Touch-Up</a>
      </div>` : `
      <div class="detail" style="border-color:var(--gold)">
        <div class="k">Your Next Annual Touch-Up</div>
        <div>Ready to keep your brows fresh? Reach out whenever you'd like to book your next Annual Touch-Up.</div>
        <a class="btn" href="book-eleganza.html?category=touch_up">Book Your Next Visit</a>
      </div>`;
  }

  card.innerHTML = `
    <div class="brand">Eleganza Naturally Beautiful</div>
    <h1>Thank You, <em>${esc(first)}</em></h1>
    <p class="sub">It was such a pleasure taking care of your brows today. Here's your receipt, your aftercare ritual, and what's next.</p>
    <div class="detail">
      <div class="k">Receipt</div>
      <div>Service <strong>${esc(receipt.service_name)}</strong></div>
      <div>Amount Paid <strong>${esc(receipt.currency || "TTD")}$${Number(receipt.amount || 0).toLocaleString()}</strong></div>
      <div>Date <strong>${esc(fmtDate(receipt.receipt_date))}</strong></div>
    </div>
    <div class="detail" style="border-color:var(--line)">
      <div class="k">Your Aftercare Ritual</div>
      <div>Your next 5 days decide how gorgeously your brows heal — follow the guide exactly as Amii teaches it.</div>
      <a class="btn-ghost" href="${aftercareHref}">View My Aftercare Guide</a>
    </div>
    ${followupSection}
    <div class="detail" style="border-color:var(--gold)">
      <div class="k">Leave A Review</div>
      <div>Loved your visit? A review helps this small studio bloom — it means the world to us.</div>
      <a class="review-btn" href="${esc(CONFIG.GOOGLE_REVIEW_URL)}" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#A8532F" d="M21.35 11.1H12v2.9h5.35c-.5 2.5-2.6 3.9-5.35 3.9a6 6 0 1 1 0-12c1.5 0 2.9.55 3.95 1.55l2.15-2.15A9 9 0 1 0 12 21c5.2 0 8.65-3.65 8.65-8.8 0-.4-.05-.75-.3-1.1z"/></svg>
        Review Us On Google
      </a>
      <a class="review-btn" href="${esc(CONFIG.FACEBOOK_REVIEW_URL)}" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#A8532F" d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5h1.65V3.6c-.3-.04-1.3-.12-2.45-.12-2.4 0-4.05 1.47-4.05 4.17v2.25H7.5V13h2.7v8h3.3z"/></svg>
        Review Us On Facebook
      </a>
    </div>
    <p class="sub" style="margin-top:22px">Thank you again for trusting us with your brows. ✨</p>
  `;
}

load();
</script>
<script src="whatsapp-widget.js"></script>
</body>
</html>
